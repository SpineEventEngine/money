syntax = "proto3";

package spine.money;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_multiple_files = true;
option java_outer_classname = "MoneyProto";
option java_package = "io.spine.money";

option (experimental_all) = true;

//
// The `Money` type below is modeled after one defined in Google APIs.
// For the original code see:
//   https://raw.githubusercontent.com/googleapis/googleapis/master/google/type/money.proto
// But in our type we use the `Currency` message instead of a string currency code
// to have the code validated and to provide Java API for currencies.
//

// An amount of money in its currency type.
message Money {

    // Was the `Currency` enum before version 2.0.0.
    reserved 1;

    // The currency of the amount of money.
    Currency currency = 4 [(required) = true];

    // The whole units of the amount.
    //
    // For example, if `currency` is `EUR`, then 1 unit is one euro.
    int64 units = 2;

    // Number of nano (10^-9) units of the amount.
    //
    // The value must be between -999,999,999 and +999,999,999 inclusive.
    // If `units` is positive, `nanos` must be positive or zero.
    // If `units` is zero, `nanos` can be positive, zero, or negative.
    // If `units` is negative, `nanos` must be negative or zero.
    // For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
    int32 nanos = 3;
}

// A currency identified by its code.
//
// For ISO 4217 currencies, the code is the alphabetic code of the currency, e.g. `EUR`.
// Other currencies, such as cryptocurrencies or loyalty points, use codes defined
// by the application.
//
// Information about a currency, such as its name or the number of minor units,
// is not a part of this type. Please see `CurrencyInfo` for details.
//
message Currency {
    option (is).java_type = "CurrencyMixin";

    // The code of the currency, which consists of 2 to 12 uppercase ASCII letters or digits.
    string code = 1 [(required) = true, (pattern).regex = "^[A-Z0-9]{2,12}$"];
}

// Information about a currency.
//
// For ISO 4217 currencies known to the Java runtime, the library provides this information.
// For other currencies, applications provide it via `CurrencyProvider`.
//
message CurrencyInfo {

    // The currency this information is about.
    Currency currency = 1 [(required) = true];

    // The name of the currency in English, e.g. "US Dollar".
    string name = 2;

    // The symbol of the currency, e.g. "$".
    //
    // ISO 4217 does not define currency symbols, and the symbol in use often depends
    // on the locale. For ISO 4217 currencies, this is the symbol used in English.
    //
    string symbol = 3;

    // The ISO 4217 numeric code of the currency, or zero if the currency does not have one.
    //
    // When displayed, numeric codes must consist of 3 digits (e.g., "008", "050").
    //
    int32 numeric_code = 4;

    // The number of digits after the decimal separator.
    //
    // The value is less than zero if there are no minor units for this currency (e.g., for gold).
    // See ISO 4217 "minor unit" definition for details.
    //
    int32 fraction_digits = 5;
}
